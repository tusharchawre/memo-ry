<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F5}a:hover{color:#C7C7CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F5; font-family: 'Geist', sans-serif; display: flex; flex-direction: column">
  <div style="padding: 10px 12px 0; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center">
    <a href="Project.dc.html" aria-label="Back to folder" style="width: 44px; height: 44px; color: #8E8E93; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="text-align: center; font-family: 'Geist Mono', monospace; font-size: 13px; color: #8E8E93">hook melody.m4a</div>
    <button aria-label="More" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F5F5F5; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
    </button>
  </div>

  <div style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.6px">hook melody</div>
    <div style="font-size: 14px; color: #8E8E93">Money Trees · Fri 23 Oct, 2:58 AM</div>
  </div>

  <div style="padding: 36px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div role="img" aria-label="Waveform with a loop from 0:02 to 0:06 and the playhead at 0:03" style="position: relative; height: 120px">
      <div style="position: absolute; left: 22%; width: 45%; top: 0; bottom: 0; border-radius: 8px; background: #1C1C1E"></div>
      <div style="position: absolute; left: 22%; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: #F5F5F5"></div>
      <div style="position: absolute; left: 67%; top: 0; bottom: 0; width: 3px; border-radius: 2px; margin-left: -3px; background: #F5F5F5"></div>
      <div style="position: relative; height: 120px; padding: 0 6px; display: flex; align-items: center; justify-content: space-between">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="54"><div style="width: 3px; height: {{b.h}}; border-radius: 2px; background: {{b.c}}"></div></sc-for>
      </div>
      <div style="position: absolute; left: 35%; top: -6px; bottom: -6px; width: 2px; background: #FF5A52"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 12px; color: #8E8E93">
      <span>0:03.2</span><span style="color: #C7C7CC">loop 0:02 – 0:06</span><span>0:09</span>
    </div>
  </div>

  <div style="padding: 30px 28px 0; display: flex; justify-content: space-between; align-items: center">
    <button aria-label="Loop on" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: #F5F5F5; color: #000000; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"></path><path d="M4 11V9a4 4 0 0 1 4-4h12"></path><path d="M7 22l-3-3 3-3"></path><path d="M20 13v2a4 4 0 0 1-4 4H4"></path></svg>
    </button>
    <button aria-label="Back 5 seconds" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F5F5F5; font-family: 'Geist Mono', monospace; font-size: 13px">−5</button>
    <button aria-label="Pause" style="width: 72px; height: 72px; border: 0; border-radius: 999px; background: #F5F5F5; color: #000000; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"></rect><rect x="14" y="4" width="5" height="16" rx="1.5"></rect></svg>
    </button>
    <button aria-label="Forward 5 seconds" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F5F5F5; font-family: 'Geist Mono', monospace; font-size: 13px">+5</button>
    <button aria-label="Playback speed" style="width: 48px; height: 48px; border: 0; border-radius: 999px; background: #161616; color: #F5F5F5; font-family: 'Geist Mono', monospace; font-size: 13px">1×</button>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="padding: 0 20px 30px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid #1F1F1F; font-size: 15px">
      <span style="color: #8E8E93">Note</span><span>slow, minor</span>
    </div>
    <a href="Lyrics.dc.html" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid #1F1F1F; font-size: 15px; text-decoration: none">
      <span style="color: #8E8E93">Goes with</span>
      <span style="display: flex; align-items: center; gap: 6px">Hook<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
    </a>
    <div style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid #1F1F1F; font-size: 15px">
      <span style="color: #8E8E93">File</span><span style="font-family: 'Geist Mono', monospace; font-size: 13px">m4a · 84 KB</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid #1F1F1F; font-size: 15px">
      <span style="color: #8E8E93">Folder</span>
      <span style="display: flex; align-items: center; gap: 6px">Money Trees<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const bars = [];
    for (let i = 0; i < 54; i++) {
      const v = Math.abs(Math.sin(i * 0.62 + 0.4) * 0.55 + Math.sin(i * 0.21 + 1.1) * 0.45);
      const t = i / 54;
      const c = t < 0.35 ? '#F5F5F5' : (t >= 0.22 && t < 0.67 ? '#8E8E93' : '#3A3A3C');
      bars.push({ h: Math.max(8, Math.round(v * 100)) + '%', c });
    }
    return { bars };
  }
}
</script>
</body>
</html>
