<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+Devanagari:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F5}a:hover{color:#C7C7CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F5; font-family: 'Geist', 'Noto Sans Devanagari', sans-serif; display: flex; flex-direction: column">
  <div style="flex-grow: 1; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.6px">Library</div>
      <div style="display: flex; gap: 6px">
        <a href="Sync.dc.html" aria-label="Mac sync: up to date" style="width: 40px; height: 40px; border-radius: 999px; color: #F5F5F5; display: flex; align-items: center; justify-content: center; position: relative">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"></rect><path d="M2 19h20"></path></svg>
          <span style="position: absolute; top: 9px; right: 8px; width: 7px; height: 7px; border-radius: 999px; background: #2F9E5B; border: 2px solid #000000"></span>
        </a>
        <button aria-label="New folder" style="width: 40px; height: 40px; border: 0; border-radius: 999px; background: #F5F5F5; color: #000000; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </div>

    <a href="Search.dc.html" style="min-height: 42px; text-decoration: none; padding: 0 14px; border-radius: 12px; background: #161616; color: #8E8E93; font-size: 15px; display: flex; align-items: center; gap: 10px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      Search
    </a>


    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="font-size: 13px; color: #8E8E93">Folders</div>
        <div style="font-size: 13px; color: #8E8E93">Recent ↓</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 14px; row-gap: 18px">
        <sc-for list="{{folders}}" as="f" hint-placeholder-count="6">
          <a href="{{f.href}}" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #F5F5F5">
            <div style="aspect-ratio: 1 / 1; border-radius: 16px; background: #161616; display: flex; align-items: center; justify-content: center; color: #C7C7CC">
              <sc-if value="{{f.inbox}}" hint-placeholder-val="{{false}}">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3z"></path><path d="M3 13h5l1 2h6l1-2h5"></path></svg>
              </sc-if>
              <sc-if value="{{f.folder}}" hint-placeholder-val="{{true}}">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"></path></svg>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 2px">
              <div style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.name}}</div>
              <div style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #8E8E93">{{f.meta}}</div>
            </div>
          </a>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; color: #8E8E93">Recent files</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 14px">
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="aspect-ratio: 1 / 1; border-radius: 14px; background: #161616; position: relative; overflow: hidden">
              <sc-if value="{{r.text}}" hint-placeholder-val="{{false}}">
                <div aria-hidden="true" style="position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; overflow: hidden; font-size: 7.5px; line-height: 1.45; color: #C7C7CC">
                  <div style="font-family: 'Geist Mono', monospace; font-size: 6px; letter-spacing: 0.5px; color: #8E8E93">VERSE 1</div>
                  <div>[ verse 1 lyrics ]</div>
                  <div style="font-family: 'Geist Mono', monospace; font-size: 6px; letter-spacing: 0.5px; color: #8E8E93; margin-top: 4px">HOOK</div>
                  <div>[ hook lyrics ]</div>
                </div>
              </sc-if>
              <sc-if value="{{r.audio}}" hint-placeholder-val="{{true}}">
                <div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; top: 22%; bottom: 32%; display: flex; align-items: center; justify-content: space-between">
                  <sc-for list="{{r.bars}}" as="b" hint-placeholder-count="16"><div style="width: 2px; height: {{b}}; border-radius: 1px; background: #D1D1D6"></div></sc-for>
                </div>
                <div style="position: absolute; left: 9px; bottom: 8px; font-family: 'Geist Mono', monospace; font-size: 10px; color: #8E8E93">{{r.dur}}</div>
              </sc-if>
              <sc-if value="{{r.image}}" hint-placeholder-val="{{false}}">
                <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cover image preview" style="display: block">
                  <rect width="100" height="100" fill="#2B1620"></rect>
                  <circle cx="63" cy="38" r="17" fill="#E8DCCB"></circle>
                  <path d="M0 72 Q22 60 46 70 T100 64 V100 H0z" fill="#120A0E"></path>
                  <path d="M0 84 Q30 76 60 84 T100 80 V100 H0z" fill="#07050A"></path>
                </svg>
              </sc-if>
              <sc-if value="{{r.midi}}" hint-placeholder-val="{{false}}">
                <svg width="100%" height="100%" viewBox="0 0 100 100" aria-hidden="true" style="display: block">
                  <path d="M8 22H92M8 34H92M8 46H92M8 58H92M8 70H92M8 82H92" stroke="#242426" stroke-width="1"></path>
                  <rect x="10" y="59" width="16" height="10" rx="2" fill="#D1D1D6"></rect>
                  <rect x="28" y="47" width="10" height="10" rx="2" fill="#D1D1D6"></rect>
                  <rect x="40" y="35" width="22" height="10" rx="2" fill="#D1D1D6"></rect>
                  <rect x="64" y="47" width="10" height="10" rx="2" fill="#D1D1D6"></rect>
                  <rect x="76" y="23" width="14" height="10" rx="2" fill="#D1D1D6"></rect>
                  <rect x="40" y="71" width="34" height="10" rx="2" fill="#5A5A5E"></rect>
                </svg>
              </sc-if>
              <sc-if value="{{r.doc}}" hint-placeholder-val="{{false}}">
                <div aria-hidden="true" style="position: absolute; top: 12px; left: 16px; right: 16px; bottom: 0; border-radius: 4px 4px 0 0; background: #E8E8E5; padding: 7px; box-sizing: border-box; font-family: 'Geist Mono', monospace; font-size: 6.5px; line-height: 1.7; color: #2C2C2E">
                  <div style="font-weight: 500">Money Trees</div>
                  <div>Am&#160;&#160;F&#160;&#160;C&#160;&#160;G</div>
                  <div>Am&#160;&#160;F&#160;&#160;E</div>
                  <div>Dm&#160;&#160;Am&#160;&#160;E</div>
                </div>
              </sc-if>
              <div style="position: absolute; bottom: 7px; right: 7px; padding: 2px 5px; border-radius: 5px; background: #000000; font-family: 'Geist Mono', monospace; font-size: 10px; color: #C7C7CC">{{r.ext}}</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 2px">
              <div style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</div>
              <div style="font-size: 11px; color: #8E8E93; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.where}}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="padding: 10px 20px 24px; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 12px; color: #8E8E93; border-top: 1px solid #1F1F1F">
    <span style="width: 6px; height: 6px; border-radius: 999px; background: #2F9E5B"></span>
    Synced to MacBook Air · 2 min ago
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  bars(seed) {
    const out = [];
    for (let i = 0; i < 16; i++) {
      const v = Math.abs(Math.sin(i * 0.9 + seed) * 0.55 + Math.sin(i * 0.31 + seed * 1.7) * 0.45);
      out.push(Math.max(12, Math.round(v * 100)) + '%');
    }
    return out;
  }
  renderVals() {
    const folder = (name, meta, href) => ({ name, meta, href: href || 'Main.dc.html', folder: true, inbox: false });
    return {
      folders: [
        { name: 'Inbox', meta: '3 items', href: 'Main.dc.html', folder: false, inbox: true },
        folder('good kid, m.A.A.d city', '3 songs', 'Project.dc.html'),
        folder('DAMN.', '14 items'),
        folder('To Pimp a Butterfly', '2 items'),
        folder('Beats', '9 items'),
        folder('References', '6 items')
      ],
      recent: [
        { name: 'hook melody', where: 'Money Trees', ext: 'm4a', dur: '0:09', bars: this.bars(0.4), audio: true, text: false, image: false, midi: false, doc: false },
        { name: 'lyrics', where: 'Money Trees', ext: 'md', dur: '', bars: [], audio: false, text: true, image: false, midi: false, doc: false },
        { name: 'cover', where: 'good kid, m.A.A.d city', ext: 'jpg', dur: '', bars: [], audio: false, text: false, image: true, midi: false, doc: false }
      ]
    };
  }
}
</script>
</body>
</html>
