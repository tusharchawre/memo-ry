<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Song folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+Devanagari:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F5}a:hover{color:#C7C7CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F5; font-family: 'Geist', 'Noto Sans Devanagari', sans-serif; display: flex; flex-direction: column">
  <div style="flex-grow: 1; padding: 10px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

    <div style="display: flex; justify-content: space-between; align-items: center; margin: 0 -8px">
      <a href="Main.dc.html" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; gap: 2px; color: #8E8E93; font-size: 15px; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        good kid, m.A.A.d city
      </a>
      <button aria-label="Folder options" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #F5F5F5; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.6px">Money Trees</div>
      <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap">
        <div style="padding: 5px 10px; border-radius: 999px; background: #161616; color: #F5F5F5; font-size: 12px; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #A78BFA"></span>Writing</div>
      </div>
    </div>

    <div style="display: flex; gap: 18px; font-size: 14px; border-bottom: 1px solid #1F1F1F">
      <div style="padding: 8px 0; color: #F5F5F5; font-weight: 500; border-bottom: 2px solid #F5F5F5; margin-bottom: -1px">All</div>
      <div style="padding: 8px 0; color: #8E8E93">Lyrics</div>
      <div style="padding: 8px 0; color: #8E8E93">Audio</div>
      <div style="padding: 8px 0; color: #8E8E93">Files</div>
      <div style="flex-grow: 1"></div>
      <div style="padding: 8px 0; color: #8E8E93; font-size: 13px">9 items</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 14px; row-gap: 18px">
      <sc-for list="{{items}}" as="f" hint-placeholder-count="9">
        <a href="{{f.href}}" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #F5F5F5">
          <div style="aspect-ratio: 1 / 1; border-radius: 14px; background: #161616; position: relative; overflow: hidden">
            <sc-if value="{{f.text}}" hint-placeholder-val="{{false}}">
              <div aria-hidden="true" style="position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; overflow: hidden; font-size: 7.5px; line-height: 1.45; color: #C7C7CC">
                <div style="font-family: 'Geist Mono', monospace; font-size: 6px; letter-spacing: 0.5px; color: #8E8E93">VERSE 1</div>
                <div>[ verse 1 lyrics ]</div>
                <div style="font-family: 'Geist Mono', monospace; font-size: 6px; letter-spacing: 0.5px; color: #8E8E93; margin-top: 4px">HOOK</div>
                <div>[ hook lyrics ]</div>
              </div>
            </sc-if>
            <sc-if value="{{f.audio}}" hint-placeholder-val="{{true}}">
              <div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; top: 22%; bottom: 32%; display: flex; align-items: center; justify-content: space-between">
                <sc-for list="{{f.bars}}" as="b" hint-placeholder-count="16"><div style="width: 2px; height: {{b}}; border-radius: 1px; background: #D1D1D6"></div></sc-for>
              </div>
              <div style="position: absolute; left: 9px; bottom: 8px; font-family: 'Geist Mono', monospace; font-size: 10px; color: #8E8E93">{{f.dur}}</div>
            </sc-if>
            <sc-if value="{{f.image}}" hint-placeholder-val="{{false}}">
              <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cover image preview" style="display: block">
                <rect width="100" height="100" fill="#2B1620"></rect>
                <circle cx="63" cy="38" r="17" fill="#E8DCCB"></circle>
                <path d="M0 72 Q22 60 46 70 T100 64 V100 H0z" fill="#120A0E"></path>
                <path d="M0 84 Q30 76 60 84 T100 80 V100 H0z" fill="#07050A"></path>
              </svg>
            </sc-if>
            <sc-if value="{{f.midi}}" hint-placeholder-val="{{false}}">
              <svg width="100%" height="100%" viewBox="0 0 100 100" aria-hidden="true" style="display: block">
                <path d="M8 22H92M8 34H92M8 46H92M8 58H92M8 70H92M8 82H92" stroke="#242426" stroke-width="1"></path>
                <rect x="10" y="59" width="16" height="10" rx="2" fill="#D1D1D6"></rect>
                <rect x="28" y="47" width="10" height="10" rx="2" fill="#D1D1D6"></rect>
                <rect x="40" y="35" width="22" height="10" rx="2" fill="#D1D1D6"></rect>
                <rect x="64" y="47" width="10" height="10" rx="2" fill="#D1D1D6"></rect>
                <rect x="76" y="23" width="14" height="10" rx="2" fill="#D1D1D6"></rect>
                <rect x="40" y="71" width="34" height="10" rx="2" fill="#5A5A5E"></rect>
              </svg>
            </sc-if>
            <sc-if value="{{f.doc}}" hint-placeholder-val="{{false}}">
              <div aria-hidden="true" style="position: absolute; top: 12px; left: 16px; right: 16px; bottom: 0; border-radius: 4px 4px 0 0; background: #E8E8E5; padding: 7px; box-sizing: border-box; font-family: 'Geist Mono', monospace; font-size: 6.5px; line-height: 1.7; color: #2C2C2E">
                <div style="font-weight: 500">Money Trees</div>
                <div>Am&#160;&#160;F&#160;&#160;C&#160;&#160;G</div>
                <div>Am&#160;&#160;F&#160;&#160;E</div>
                <div>Dm&#160;&#160;Am&#160;&#160;E</div>
              </div>
            </sc-if>
            <div style="position: absolute; bottom: 7px; right: 7px; padding: 2px 5px; border-radius: 5px; background: #000000; font-family: 'Geist Mono', monospace; font-size: 10px; color: #C7C7CC">{{f.ext}}</div>
          </div>
          <div style="font-size: 13px; font-weight: 500; padding: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.name}}</div>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 20px 26px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px">
    <a href="AddFiles.dc.html" style="min-height: 44px; border-radius: 999px; background: #161616; text-decoration: none; color: #F5F5F5; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add
    </a>
    <a href="Record.dc.html" aria-label="Record into this folder" style="width: 64px; height: 64px; border-radius: 999px; border: 3px solid #F5F5F5; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 0; text-decoration: none">
      <span style="width: 48px; height: 48px; border-radius: 999px; background: #FF5A52"></span>
    </a>
    <a href="Lyrics.dc.html" style="min-height: 44px; border-radius: 999px; background: #161616; color: #F5F5F5; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Write
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  bars(seed) {
    const out = [];
    for (let i = 0; i < 16; i++) {
      const v = Math.abs(Math.sin(i * 0.9 + seed) * 0.55 + Math.sin(i * 0.31 + seed * 1.7) * 0.45);
      out.push(Math.max(12, Math.round(v * 100)) + '%');
    }
    return out;
  }
  renderVals() {
    const f = (name, ext, kind, href, dur, seed) => ({ name, ext, dur: dur || '', bars: this.bars(seed || 0), href: href || (kind === 'audio' ? 'Player.dc.html' : 'Project.dc.html'), text: kind === 'text', audio: kind === 'audio', image: kind === 'image', midi: kind === 'midi', doc: kind === 'doc' });
    return {
      items: [
        f('lyrics', 'md', 'text', 'Lyrics.dc.html'),
        f('hook melody', 'm4a', 'audio', null, '0:09', 0.4),
        f('verse 2 flow', 'm4a', 'audio', null, '0:31', 2.1),
        f('beat idea 72bpm', 'm4a', 'audio', null, '0:48', 3.7),
        f('untitled hum', 'm4a', 'audio', null, '0:14', 5.2),
        f('reference', 'mp3', 'audio', null, '2:58', 1.1),
        f('cover', 'jpg', 'image'),
        f('beat-v2', 'mid', 'midi'),
        f('chords', 'pdf', 'doc')
      ]
    };
  }
}
</script>
</body>
</html>
