<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save recording</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F5}a:hover{color:#C7C7CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F5; font-family: 'Geist', sans-serif; display: flex; flex-direction: column; justify-content: flex-end">
  <div style="flex-grow: 1; padding: 24px 20px; opacity: 0.3">
    <div style="font-size: 13px; color: #8E8E93; text-align: center">Recording into Money Trees</div>
  </div>

  <div style="background: #111111; border-radius: 28px 28px 0 0; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 20px">
    <div style="align-self: center; width: 36px; height: 5px; border-radius: 999px; background: #3A3A3C"></div>
    <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.3px">Save recording</div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #1C1C1E">
      <button aria-label="Play recording" style="width: 36px; height: 36px; flex-shrink: 0; border: 0; border-radius: 999px; background: #F5F5F5; color: #000000; display: flex; align-items: center; justify-content: center">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3.5v17l15-8.5z"></path></svg>
      </button>
      <div aria-hidden="true" style="flex-grow: 1; height: 28px; display: flex; align-items: center; justify-content: space-between">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="40"><div style="width: 2px; height: {{b}}; border-radius: 1px; background: #C7C7CC"></div></sc-for>
      </div>
      <div style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #8E8E93">0:09</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="memo-name" style="font-size: 13px; color: #8E8E93">Name</label>
      <input id="memo-name" value="hook melody" style="min-height: 46px; padding: 0 14px; border: 0; border-radius: 12px; background: #1C1C1E; color: #F5F5F5; font-family: inherit; font-size: 16px; outline: 0">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="memo-note" style="font-size: 13px; color: #8E8E93">Note</label>
      <input id="memo-note" value="slow, minor" style="min-height: 46px; padding: 0 14px; border: 0; border-radius: 12px; background: #1C1C1E; color: #F5F5F5; font-family: inherit; font-size: 16px; outline: 0">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; color: #8E8E93">Goes with</div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button style="min-height: 36px; padding: 0 13px; border: 0; border-radius: 999px; background: #1C1C1E; color: #C7C7CC; font-family: inherit; font-size: 14px">None</button>
        <button style="min-height: 36px; padding: 0 13px; border: 0; border-radius: 999px; background: #1C1C1E; color: #C7C7CC; font-family: inherit; font-size: 14px">Verse 1</button>
        <button style="min-height: 36px; padding: 0 13px; border: 0; border-radius: 999px; background: #F5F5F5; color: #000000; font-family: inherit; font-size: 14px; font-weight: 500">Hook</button>
        <button style="min-height: 36px; padding: 0 13px; border: 0; border-radius: 999px; background: #1C1C1E; color: #C7C7CC; font-family: inherit; font-size: 14px">Verse 2</button>
        <button style="min-height: 36px; padding: 0 13px; border: 0; border-radius: 999px; background: #1C1C1E; color: #C7C7CC; font-family: inherit; font-size: 14px">Bridge</button>
      </div>
    </div>

    <div style="font-family: 'Geist Mono', monospace; font-size: 11px; line-height: 1.5; color: #8E8E93">Money Trees/recordings/<br>2026-10-24 hook melody.m4a</div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Project.dc.html" style="min-height: 50px; border-radius: 999px; background: #F5F5F5; color: #000000; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Save</a>
      <a href="Project.dc.html" style="min-height: 44px; color: #8E8E93; font-size: 15px; text-decoration: none; display: flex; align-items: center; justify-content: center">Discard</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const bars = [];
    for (let i = 0; i < 40; i++) {
      const v = Math.abs(Math.sin(i * 0.9 + 0.4) * 0.55 + Math.sin(i * 0.31 + 0.68) * 0.45);
      bars.push(Math.max(12, Math.round(v * 100)) + '%');
    }
    return { bars };
  }
}
</script>
</body>
</html>
